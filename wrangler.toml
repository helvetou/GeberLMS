# Configuration Cloudflare (Workers + static assets + D1).
# Le `database_id` est un placeholder : à remplacer par la sortie de
# `wrangler d1 create geberlms` avant le premier déploiement distant.

name = "geberlms"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"

# Génère .svelte-kit/cloudflare/_worker.js avant chaque déploiement,
# y compris depuis Cloudflare Pages (la commande de déploiement reste
# « npx wrangler deploy »).
[build]
command = "npm run build"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "geberlms"
database_id = "86f0ff10-8006-4a8c-b467-d2585c602386"

# Stockage des dépôts apprenants (FR-24).
[[r2_buckets]]
binding = "FILES"
bucket_name = "geberlms-files"

# Génération de quiz par LLM (FR-31) — Workers AI.
[ai]
binding = "AI"
