<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quran Viewer (Warsh)</title>
    <style>
      @font-face {
        font-family: arab;
        src: url("./inputdata/uthmanic_warsh_v21.ttf");
      }

      :root {
        --bg: #f6f7f8;
        --panel: #ffffff;
        --border: #d0d0d0;
        --gap: 16px;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: #111;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: center;
        padding: 10px;
        background: rgba(246, 247, 248, 0.95);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(6px);
        direction: rtl;
      }

      .topbar button,
      .topbar a,
      .topbar input:not([type="range"]),
      .topbar select {
        height: 34px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 10px;
        background: var(--panel);
        font-size: 14px;
      }

      .topbar a {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: #1a0dab;
      }

      .topbar button {
        cursor: pointer;
      }

      .topbar input:not([type="range"]) {
        width: 90px;
        text-align: center;
      }

      .topbar input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        width: 130px;
        height: 24px;
        margin: 0 8px;
        padding: 0;
        border: none;
        cursor: pointer;
      }

      .topbar input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
      }

      .topbar input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        background: #444;
        border-radius: 50%;
        margin-top: -5px;
        cursor: pointer;
      }

      .topbar input[type="range"]::-moz-range-track {
        width: 100%;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
      }

      .topbar input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        background: #444;
        border: none;
        border-radius: 50%;
        cursor: pointer;
      }

      .font-control {
        display: none;
        align-items: center;
        gap: 8px;
      }

      .font-control.visible {
        display: inline-flex;
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
      }

      .spread {
        display: flex;
        gap: var(--gap);
        align-items: flex-start;
        justify-content: center;
        direction: rtl;
      }

      .page {
        flex: 0 0 auto;
        width: min(520px, 92vw);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 12px 14px 12px;
        box-sizing: border-box;
      }

      .page.hidden {
        display: none;
      }

      .page .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        color: #444;
        font-size: 12px;
        direction: ltr;
      }

      .page .mushaf {
        font-family: arab;
        font-size: 2vw;
        line-height: 1.55;
        text-align: right;
        direction: rtl;
        background-color: Cornsilk;
        padding: 10px 10px;
        border-radius: 10px;
        overflow: hidden;
      }

      @media (min-width: 900px) {
        .page .mushaf {
          font-size: 20px;
        }
      }

      .status {
        text-align: center;
        color: #444;
        margin-top: 14px;
        font-size: 13px;
      }

      .control-panel {
        display: none;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        box-sizing: border-box;
        resize: horizontal;
        overflow: hidden;
        width: 300px;
        min-width: 200px;
        max-width: 50vw;
      }

      .control-panel h3 {
        margin: 0 0 12px 0;
        font-size: 16px;
      }

      .control-panel label {
        display: block;
        font-size: 13px;
        color: #333;
        margin-top: 10px;
      }

      .control-panel input[type="number"] {
        width: 100%;
        height: 34px;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 10px;
        background: var(--panel);
        font-size: 14px;
      }

      .control-panel input[type="range"] {
        width: 100%;
      }

      .control-panel button {
        width: 100%;
        height: 34px;
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 10px;
        background: var(--panel);
        font-size: 14px;
        cursor: pointer;
      }

      #chartContainer {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        background: #fafafa;
        overflow-y: auto;
        max-height: calc(100vh - 220px);
      }

      body.memorize-mode .wrap {
        display: flex;
        flex-direction: row;
        max-width: 100%;
        padding: 16px;
        gap: var(--gap);
      }

      body.memorize-mode .main-content {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      body.memorize-mode .control-panel {
        display: block;
        flex: 0 0 auto;
      }

      body.memorize-mode .page {
        width: 100%;
        max-width: 100%;
        flex: 1 1 auto;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <button id="prevBtn" type="button" aria-label="Previous page" title="Previous">→</button>
      <button id="nextBtn" type="button" aria-label="Next page" title="Next">←</button>
      <label>
        Page
        <input id="pageInput" inputmode="numeric" pattern="[0-9]*" />
      </label>
      <button id="prevSuraBtn" type="button" aria-label="Previous surah" title="Previous surah">→|</button>
      <button id="nextSuraBtn" type="button" aria-label="Next surah" title="Next surah">|←</button>
      <label>
        Surah
        <select id="suraSelect"></select>
      </label>
      <label>
        Mode
        <select id="modeSelect">
          <option value="single">Single</option>
          <option value="spread">Spread</option>
          <option value="memorize">Memorize</option>
        </select>
      </label>
      <a href="./thumn.html" title="Thumn index (۞ divisions)">Thumn</a>
      <label class="font-control" id="fontSizeWrap">
        Font
        <input id="fontSize" type="range" min="16" max="60" step="1" value="28" />
        <span id="fontSizeValue"></span>
      </label>
    </div>

    <div class="wrap">
      <div class="main-content">
        <div class="spread" id="spreadRoot">
          <div class="page" id="rightPage">
            <div class="meta">
              <span id="rightLabel"></span>
              <span id="rightSura"></span>
            </div>
            <div class="mushaf" id="rightText"></div>
          </div>
          <div class="page" id="leftPage">
            <div class="meta">
              <span id="leftLabel"></span>
              <span id="leftSura"></span>
            </div>
            <div class="mushaf" id="leftText"></div>
          </div>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="control-panel" id="controlPanel">
        <h3>Contrôles</h3>
        <label>
          Gris du reste
          <input id="dimRange" type="range" min="0" max="100" step="1" value="30" />
          <span id="dimValue">30%</span>
        </label>
        <button id="drawBtn" type="button">Draw Histogram</button>
        <div id="chartContainer"></div>
      </div>
    </div>

    <script src="./viewer.js?v=4"></script>
  </body>
</html>
