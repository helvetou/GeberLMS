# Configuration Cloudflare (Workers + static assets + D1).
# Le `database_id` est un placeholder : à remplacer par la sortie de
# `wrangler d1 create geberlms` avant le premier déploiement distant.

name = "geberlms"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"

# Génère .svelte-kit/cloudflare/_worker.js avant chaque déploiement,
# y compris depuis Cloudflare Pages (la commande de déploiement reste
# « npx wrangler deploy »).
[build]
command = "npm run build"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "geberlms"
database_id = "00000000-0000-0000-0000-000000000000"
