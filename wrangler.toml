# Configuration Cloudflare (Workers + D1).
# Le `database_id` est un placeholder : à remplacer par la sortie de
# `wrangler d1 create geberlms` avant le premier déploiement distant.

name = "geberlms"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "geberlms"
database_id = "00000000-0000-0000-0000-000000000000"
